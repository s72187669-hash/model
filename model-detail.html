<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模特档案</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <div class="flex items-center mb-8">
            <button id="backBtn" class="mr-4 text-gray-600 hover:text-gray-900">
                <i data-lucide="arrow-left"></i>
            </button>
            <h1 id="modelNameHeader" class="text-3xl font-bold">[模特名字]档案</h1>
        </div>

        <div class="bg-white p-8 rounded-lg shadow-lg">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
                <div class="md:col-span-1">
                    <div id="modelImageDisplay" class="w-48 h-48 bg-gray-200 rounded-full mb-4 flex items-center justify-center overflow-hidden mx-auto cursor-pointer" onclick="if(this.querySelector('img')) this.querySelector('img').click()">
                         <i data-lucide="user" class="w-12 h-12 text-gray-400"></i>
                    </div>
                    <p class="text-center text-gray-500 text-sm">模特图片</p>
                </div>
                <div class="md:col-span-3 grid grid-cols-2 gap-y-4 text-sm">
                    <div>
                        <p class="font-semibold">模特姓名</p>
                        <p id="detailModelName" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">模特代号</p>
                        <p id="detailModelCode" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">身高</p>
                        <p id="detailHeight" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">拍摄评级</p>
                        <p id="detailShootingLevel" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">体重</p>
                        <p id="detailWeight" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">抖音号</p>
                        <p id="detailDouyin" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">年龄</p>
                        <p id="detailAge" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">DY粉丝数</p>
                        <p id="detailDouyinFans" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">联系电话</p>
                        <p id="detailPhone" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">小红书号</p>
                        <p id="detailXiaohongshu" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">微信号</p>
                        <p id="detailWechat" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">XHS粉丝数</p>
                        <p id="detailXiaohongshuFans" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">集美账号</p>
                        <p id="detailJimeihao" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">视频号</p>
                        <p id="detailVideoNumber" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">累计拍摄次数</p>
                        <p id="detailTotalShoots" class="text-gray-600"></p>
                    </div>
                    <div>
                        <p class="font-semibold">SPH粉丝</p>
                        <p id="detailSphFans" class="text-gray-600"></p>
                    </div>
                    <div class="col-span-2">
                        <p class="font-semibold">收货地址</p>
                        <p id="detailAddress" class="text-gray-600"></p>
                    </div>
                </div>
            </div>

            <div class="mt-8">
                <div class="bg-blue-50 p-4 rounded-lg">
                    <h3 class="text-lg font-semibold mb-2">拍摄要求</h3>
                    <p id="detailShootingRequirements" class="text-gray-600"></p>
                </div>
            </div>

            <div class="mt-8">
                <div class="bg-blue-50 p-4 rounded-lg">
                    <h3 class="text-lg font-semibold mb-2">模特要求</h3>
                    <p id="detailModelRequirements" class="text-gray-600"></p>
                </div>
            </div>
            
            <div class="mt-8 text-center space-x-4">
                 <button id="editModelBtn" class="bg-green-500 text-white py-2 px-8 rounded-lg hover:bg-green-600 inline-flex items-center">
                    <i data-lucide="edit" class="mr-2"></i>修改信息
                </button>
                 <button id="viewShootingRecordsBtn" class="bg-blue-500 text-white py-2 px-8 rounded-lg hover:bg-blue-600 inline-flex items-center">
                    <i data-lucide="calendar" class="mr-2"></i>点击查看：拍摄记录
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const backBtn = document.getElementById('backBtn');
        const editModelBtn = document.getElementById('editModelBtn');
        const viewShootingRecordsBtn = document.getElementById('viewShootingRecordsBtn');

        backBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        editModelBtn.addEventListener('click', () => {
            window.location.href = `model-form.html?id=${modelId}`;
        });
        
        viewShootingRecordsBtn.addEventListener('click', () => {
            window.location.href = `shooting-records.html?id=${modelId}`;
        });

        // 获取URL中的模特ID
        const urlParams = new URLSearchParams(window.location.search);
        const modelId = urlParams.get('id');

        // 从localStorage中获取模特数据
        const models = JSON.parse(localStorage.getItem('models')) || [];
        const model = models.find(m => m.id === modelId);

        if (model) {
            // 更新页面标题
            document.getElementById('modelNameHeader').textContent = `${model.name}档案`;
            
            // 更新图片
            const imageDisplay = document.getElementById('modelImageDisplay');
            if (model.image && model.image.startsWith('data:image/')) {
                // 如果是Base64图片，直接显示
                const img = document.createElement('img');
                img.src = model.image;
                img.alt = model.name;
                img.className = 'w-full h-full object-cover';
                img.style.cursor = 'pointer';
                img.onclick = (e) => {
                    e.stopPropagation();
                    const modal = document.createElement('div');
                    modal.className = 'fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50';
                    modal.onclick = () => document.body.removeChild(modal);
                    
                    const bigImg = document.createElement('img');
                    bigImg.src = model.image;
                    bigImg.className = 'max-w-[90%] max-h-[90vh] object-contain';
                    bigImg.onclick = (e) => e.stopPropagation();
                    
                    modal.appendChild(bigImg);
                    document.body.appendChild(modal);
                };
                imageDisplay.innerHTML = '';
                imageDisplay.appendChild(img);
            } else {
                // 使用占位符图片
                const img = document.createElement('img');
                img.src = `https://api.dicebear.com/9.x/avataaars/svg?seed=${model.name}`;
                img.alt = model.name;
                img.className = 'w-full h-full object-cover';
                img.style.cursor = 'pointer';
                img.onclick = (e) => {
                    e.stopPropagation();
                    const modal = document.createElement('div');
                    modal.className = 'fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50';
                    modal.onclick = () => document.body.removeChild(modal);
                    
                    const bigImg = document.createElement('img');
                    bigImg.src = `https://api.dicebear.com/9.x/avataaars/svg?seed=${model.name}`;
                    bigImg.className = 'max-w-[90%] max-h-[90vh] object-contain';
                    bigImg.onclick = (e) => e.stopPropagation();
                    
                    modal.appendChild(bigImg);
                    document.body.appendChild(modal);
                };
                imageDisplay.innerHTML = '';
                imageDisplay.appendChild(img);
            }

            // 更新详细信息
            document.getElementById('detailModelName').textContent = model.name || '暂无';
            document.getElementById('detailModelCode').textContent = model.code || '暂无';
            document.getElementById('detailHeight').textContent = model.height || '暂无';
            document.getElementById('detailShootingLevel').textContent = model.shootingLevel || '暂无';
            document.getElementById('detailWeight').textContent = model.weight || '暂无';
            document.getElementById('detailDouyin').textContent = model.douyin || '暂无';
            document.getElementById('detailAge').textContent = model.age || '暂无';
            document.getElementById('detailDouyinFans').textContent = model.douyinFans || '暂无';
            document.getElementById('detailPhone').textContent = model.phone || '暂无';
            document.getElementById('detailXiaohongshu').textContent = model.xiaohongshu || '暂无';
            document.getElementById('detailWechat').textContent = model.wechat || '暂无';
            document.getElementById('detailXiaohongshuFans').textContent = model.xiaohongshuFans || '暂无';
            document.getElementById('detailJimeihao').textContent = model.jimeihao || '暂无';
            document.getElementById('detailVideoNumber').textContent = model.videoNumber || '暂无';
            document.getElementById('detailTotalShoots').textContent = model.totalShoots || '暂无';
            document.getElementById('detailSphFans').textContent = model.sphFans || '暂无';
            document.getElementById('detailAddress').textContent = model.address || '暂无';
            document.getElementById('detailShootingRequirements').textContent = model.shootingRequirements || '暂无特殊要求';
            document.getElementById('detailModelRequirements').textContent = model.modelRequirements || '暂无特殊要求';

        } else {
            alert('未找到该模特信息');
            window.location.href = 'index.html';
        }

    </script>
</body>
</html>
